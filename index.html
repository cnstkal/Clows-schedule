<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a10">
<meta name="description" content="CLOW schedule archive">
<title>CLOW ARCHIVE</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <aside class="sidebar" aria-label="주 메뉴">
    <div class="brand">CLOW<br><span>ARCHIVE</span></div>
    <nav id="desktop-nav" class="nav"></nav>
    <div class="sidebar-actions">
      <button id="theme-btn" class="icon-btn" type="button" aria-label="테마 전환">☾</button>
      <button id="admin-btn" class="icon-btn" type="button" aria-label="관리">⚙</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="mobile-brand">CLOW <span>ARCHIVE</span></div>
      <h1 id="page-title">SCHEDULE</h1>
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="검색" autocomplete="off"></label>
      <button id="mobile-theme" class="icon-btn mobile-only" type="button" aria-label="테마 전환">☾</button>
    </header>
    <section class="toolbar">
      <div id="filters" class="filters"></div>
      <button id="add-btn" class="primary" type="button">＋ 일정 추가</button>
    </section>
    <div id="content" class="content" tabindex="-1"></div>
  </main>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-backdrop" data-close-modal></div>
  <form id="event-form" class="modal-card">
    <div class="modal-head"><h2 id="modal-title">일정 추가</h2><button type="button" class="close" data-close-modal>×</button></div>
    <input type="hidden" id="event-id">
    <div class="form-grid">
      <label>날짜<input id="event-date" type="date" required></label>
      <label>시간<input id="event-time" type="time"></label>
      <label class="wide">제목<input id="event-title" required maxlength="120" placeholder="일정 제목"></label>
      <label>카테고리<select id="event-category"><option>공식</option><option>방송</option><option>콘텐츠</option><option>기타</option></select></label>
      <label>장소<input id="event-place" maxlength="120" placeholder="장소 / 채널"></label>
      <label class="wide">설명<textarea id="event-description" rows="4" maxlength="1000" placeholder="메모"></textarea></label>
    </div>
    <div class="modal-actions"><button type="button" class="danger hidden" id="delete-btn">삭제</button><span></span><button type="button" class="ghost" data-close-modal>취소</button><button class="primary" type="submit">저장</button></div>
    <p id="form-status" class="form-status" role="status"></p>
  </form>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
